<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>園遊會線上點餐</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen pb-24">
    <!-- 橫幅：若有進行中訂單自動顯示 -->
    <div id="recentOrderBanner" class="hidden bg-amber-500 text-white px-4 py-2.5 text-center text-sm font-bold flex justify-between items-center shadow-md sticky top-0 z-40">
        <span>您有一筆進行中的訂單！</span>
        <a id="recentOrderLink" href="#" class="bg-white text-amber-600 px-3 py-1 rounded-full text-xs font-bold hover:bg-amber-100 transition">查看進度 →</a>
    </div>

    <header class="bg-indigo-600 text-white p-4 shadow-lg text-center">
        <h1 class="text-2xl font-bold">🍔 園遊會美食點餐</h1>
        <p class="text-xs text-indigo-200 mt-1">菜單與庫存即時同步中</p>
    </header>

    <main class="max-w-md mx-auto p-4">
        <div id="menuContainer" class="space-y-4">
            <p class="text-center text-gray-500 py-8">載入菜單中...</p>
        </div>
    </main>

    <!-- 懸浮購物車欄 -->
    <div id="cartBar" class="fixed bottom-0 left-0 right-0 bg-white border-t p-4 shadow-2xl max-w-md mx-auto hidden z-30">
        <div class="flex justify-between items-center mb-2">
            <span class="font-bold text-gray-700">已選餐點 (<span id="cartCount">0</span>)</span>
            <span class="text-xl font-extrabold text-indigo-600">NT$ <span id="cartTotal">0</span></span>
        </div>
        <button onclick="openCheckoutModal()" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white py-3 rounded-xl font-bold text-lg shadow-md transition">
            前往結帳 / 送出訂單
        </button>
    </div>

    <!-- 結帳彈窗 -->
    <div id="checkoutModal" class="fixed inset-0 bg-black/50 hidden justify-center items-end sm:items-center p-4 z-50">
        <div class="bg-white w-full max-w-md rounded-2xl p-6 space-y-4 shadow-2xl">
            <h2 class="text-xl font-bold text-gray-800">確認訂單資訊</h2>
            <div id="modalCartList" class="max-h-40 overflow-y-auto divide-y text-sm text-gray-600"></div>
            <div class="space-y-3 pt-2">
                <div>
                    <label class="block text-xs font-bold text-gray-600 mb-1">顧客姓名 / 暱稱 *</label>
                    <input type="text" id="custName" placeholder="例如：王小明" class="w-full border rounded-lg p-2 text-sm focus:ring-2 focus:ring-indigo-500 outline-none">
                </div>
                <div>
                    <label class="block text-xs font-bold text-gray-600 mb-1">電話末三碼 (取餐核對用) *</label>
                    <input type="text" id="custPhone" maxlength="3" placeholder="例如：567" class="w-full border rounded-lg p-2 text-sm focus:ring-2 focus:ring-indigo-500 outline-none">
                </div>
            </div>
            <div class="flex gap-2 pt-2">
                <button onclick="closeCheckoutModal()" class="w-1/3 bg-gray-200 text-gray-700 py-2.5 rounded-lg font-bold text-sm">取消</button>
                <button id="submitBtn" onclick="submitOrder()" class="w-2/3 bg-indigo-600 text-white py-2.5 rounded-lg font-bold text-sm shadow">確認送出</button>
            </div>
        </div>
    </div>

    <script>
        let menuItems = [];
        let cart = {}; // { itemId: quantity }

        // 檢查快取是否有未完成的近期訂單
        function checkRecentOrder() {
            const lastOrderId = localStorage.getItem('my_last_order_id');
            if (lastOrderId) {
                const banner = document.getElementById('recentOrderBanner');
                const link = document.getElementById('recentOrderLink');
                link.href = `status.html?id=${lastOrderId}`;
                banner.classList.remove('hidden');
            }
        }

        async function fetchMenu() {
            try {
                const res = await fetch('/api/items');
                if (!res.ok) return;
                menuItems = await res.json();
                renderMenu();
            } catch (e) {
                console.error("載入菜單失敗:", e);
            }
        }

        function renderMenu() {
            const container = document.getElementById('menuContainer');
            if (!menuItems || menuItems.length === 0) {
                container.innerHTML = '<p class="text-center text-gray-500 py-8">目前尚無上架餐點</p>';
                return;
            }

            container.innerHTML = menuItems.map(item => {
                const qty = cart[item.id] || 0;
                const isAvailable = item.available;

                return `
                    <div class="bg-white p-4 rounded-xl shadow-sm border flex justify-between items-center ${!isAvailable ? 'opacity-60 bg-gray-50' : ''}">
                        <div>
                            <h3 class="font-bold text-gray-800 text-lg">${item.name}</h3>
                            <p class="text-indigo-600 font-extrabold text-sm mt-0.5">NT$ ${item.price}</p>
                            ${!isAvailable ? '<span class="inline-block mt-1 text-xs bg-red-100 text-red-600 px-2 py-0.5 rounded font-bold">已售完 / 暫停供應</span>' : ''}
                        </div>
                        <div>
                            ${isAvailable ? `
                                <div class="flex items-center gap-2 bg-gray-100 rounded-lg p-1">
                                    <button onclick="updateCart(${item.id}, -1)" class="w-8 h-8 rounded-md bg-white shadow-sm text-gray-700 font-bold flex justify-center items-center hover:bg-gray-200 text-lg">-</button>
                                    <span class="w-6 text-center font-bold text-gray-800">${qty}</span>
                                    <button onclick="updateCart(${item.id}, 1)" class="w-8 h-8 rounded-md bg-indigo-600 shadow-sm text-white font-bold flex justify-center items-center hover:bg-indigo-700 text-lg">+</button>
                                </div>
                            ` : `
                                <span class="text-xs text-gray-400 font-bold px-3 py-1 bg-gray-200 rounded-lg">停售中</span>
                            `}
                        </div>
                    </div>
                `;
            }).join('');

            updateCartBar();
        }

        function updateCart(itemId, delta) {
            const currentQty = cart[itemId] || 0;
            const newQty = currentQty + delta;
            if (newQty <= 0) {
                delete cart[itemId];
            } else {
                cart[itemId] = newQty;
            }
            renderMenu();
        }

        function updateCartBar() {
            let count = 0;
            let total = 0;

            for (let itemId in cart) {
                const item = menuItems.find(i => i.id == itemId);
                if (item && item.available) {
                    count += cart[itemId];
                    total += item.price * cart[itemId];
                } else {
                    delete cart[itemId]; // 若餐點已停售，自動從購物車移除
                }
            }

            const cartBar = document.getElementById('cartBar');
            if (count > 0) {
                cartBar.classList.remove('hidden');
                document.getElementById('cartCount').innerText = count;
                document.getElementById('cartTotal').innerText = total;
            } else {
                cartBar.classList.add('hidden');
            }
        }

        function openCheckoutModal() {
            const list = document.getElementById('modalCartList');
            list.innerHTML = Object.keys(cart).map(id => {
                const item = menuItems.find(i => i.id == id);
                return `<div class="flex justify-between py-1.5">
                    <span>${item.name} x ${cart[id]}</span>
                    <span class="font-bold">NT$ ${item.price * cart[id]}</span>
                </div>`;
            }).join('');
            document.getElementById('checkoutModal').classList.remove('hidden');
            document.getElementById('checkoutModal').classList.add('flex');
        }

        function closeCheckoutModal() {
            document.getElementById('checkoutModal').classList.add('hidden');
            document.getElementById('checkoutModal').classList.remove('flex');
        }

        async function submitOrder() {
            const name = document.getElementById('custName').value.trim();
            const phone = document.getElementById('custPhone').value.trim();

            if (!name || !phone) {
                alert('請填寫姓名與電話末三碼！');
                return;
            }

            const items = Object.keys(cart).map(id => ({
                item_id: parseInt(id),
                quantity: cart[id]
            }));

            const submitBtn = document.getElementById('submitBtn');
            submitBtn.disabled = true;
            submitBtn.innerText = '處理中...';

            try {
                const res = await fetch('/api/orders', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        customer_name: name,
                        customer_phone: phone,
                        items: items
                    })
                });

                if (!res.ok) {
                    const err = await res.json();
                    alert('送出失敗：' + (err.detail || '餐點可能已售完，請重新確認！'));
                    fetchMenu();
                    closeCheckoutModal();
                    return;
                }

                const data = await res.json();
                const orderId = data.id || data.order_id;
                
                // 儲存訂單編號到瀏覽器快取 (localStorage)
                localStorage.setItem('my_last_order_id', orderId);

                alert(`訂單送出成功！您的單號是 #${orderId}`);
                window.location.href = `status.html?id=${orderId}`;

            } catch (e) {
                alert('網路連線異常，請稍後再試！');
            } finally {
                submitBtn.disabled = false;
                submitBtn.innerText = '確認送出';
            }
        }

        // 初始化與每 10 秒自動刷新菜單
        checkRecentOrder();
        fetchMenu();
        setInterval(fetchMenu, 10000);
    </script>
</body>
</html>
