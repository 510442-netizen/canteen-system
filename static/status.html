<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>訂單進度查詢</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen">
    <header class="bg-indigo-600 text-white p-4 shadow-lg text-center">
        <h1 class="text-2xl font-bold">📋 訂單即時狀態</h1>
        <p class="text-xs text-indigo-200 mt-1">每 5 秒自動更新最新進度</p>
    </header>

    <main class="max-w-md mx-auto p-4 space-y-4">
        <!-- 手動查詢欄 -->
        <div class="bg-white p-3 rounded-xl shadow-sm border flex gap-2">
            <input type="number" id="searchOrderId" placeholder="輸入訂單流水號 ID (例: 1)" class="w-full border rounded-lg px-3 py-1.5 text-sm focus:ring-2 focus:ring-indigo-500 outline-none">
            <button onclick="manualSearch()" class="bg-indigo-600 text-white px-4 py-1.5 rounded-lg text-sm font-bold shadow hover:bg-indigo-700">查詢</button>
        </div>

        <!-- 訂單卡片 -->
        <div id="orderStatusCard" class="bg-white p-6 rounded-2xl shadow-md border text-center space-y-4">
            <p class="text-gray-500 py-6">正在查詢訂單資料...</p>
        </div>

        <!-- 返回按鈕 -->
        <div class="text-center pt-2">
            <a href="index.html" class="inline-block bg-gray-200 text-gray-700 px-6 py-2.5 rounded-xl text-sm font-bold hover:bg-gray-300 transition">
                ← 返回點餐首頁
            </a>
        </div>
    </main>

    <script>
        let currentOrderId = null;
        let pollTimer = null;

        function getQueryParam(param) {
            const urlParams = new URLSearchParams(window.location.search);
            return urlParams.get(param);
        }

        function init() {
            let id = getQueryParam('id') || getQueryParam('order_id');
            
            if (!id) {
                id = localStorage.getItem('my_last_order_id');
            }

            if (id) {
                currentOrderId = id;
                localStorage.setItem('my_last_order_id', id);
                document.getElementById('searchOrderId').value = id;
                fetchOrderStatus();
                startPolling();
            } else {
                document.getElementById('orderStatusCard').innerHTML = `
                    <div class="py-6 text-gray-500 space-y-2">
                        <p class="text-4xl">🔍</p>
                        <p class="font-bold">找不到近期訂單紀錄</p>
                        <p class="text-xs text-gray-400">請在上方輸入您的訂單編號進行查詢</p>
                    </div>
                `;
            }
        }

        async function fetchOrderStatus() {
            if (!currentOrderId) return;

            try {
                const res = await fetch(`/api/orders/${currentOrderId}`);
                if (!res.ok) {
                    document.getElementById('orderStatusCard').innerHTML = `
                        <div class="py-6 text-red-500 space-y-2">
                            <p class="text-4xl">❌</p>
                            <p class="font-bold">查無此訂單 (#${currentOrderId})</p>
                            <p class="text-xs text-gray-400">請確認訂單編號是否正確</p>
                        </div>
                    `;
                    return;
                }

                const data = await res.json();
                renderStatusCard(data);

            } catch (e) {
                console.error("更新訂單狀態失敗:", e);
            }
        }

        function renderStatusCard(order) {
            const statusMap = {
                'PENDING': { text: '⏳ 收到訂單，等待製作', color: 'bg-amber-100 text-amber-800 border-amber-300' },
                'IN_PROGRESS': { text: '🍳 廚房製作中', color: 'bg-blue-100 text-blue-800 border-blue-300' },
                'READY': { text: '🎉 餐點已完成，請憑單號取餐！', color: 'bg-green-100 text-green-800 border-green-300 animate-pulse' },
                'COMPLETED': { text: '✅ 已完成交付', color: 'bg-gray-100 text-gray-600 border-gray-300' },
                'CANCELLED': { text: '❌ 訂單已取消', color: 'bg-red-100 text-red-800 border-red-300' }
            };

            const statusInfo = statusMap[order.status] || { text: order.status, color: 'bg-gray-100 text-gray-800' };

            const itemsHtml = (order.items || []).map(item => `
                <div class="flex justify-between text-sm py-1 border-b border-gray-100 last:border-none">
                    <span class="text-gray-700">${item.name} x ${item.quantity}</span>
                    <span class="font-bold text-gray-900">NT$ ${item.price * item.quantity}</span>
                </div>
            `).join('');

            document.getElementById('orderStatusCard').innerHTML = `
                <div class="space-y-4 text-left">
                    <div class="flex justify-between items-center pb-2 border-b">
                        <div>
                            <span class="text-xs text-gray-400">取餐號碼</span>
                            <h2 class="text-2xl font-extrabold text-indigo-600">#${order.order_number || order.order_id}</h2>
                        </div>
                        <div class="text-right">
                            <span class="text-xs text-gray-400">顧客資訊</span>
                            <p class="font-bold text-gray-800 text-sm">${order.customer_name} (末 ${order.phone_suffix})</p>
                        </div>
                    </div>

                    <div class="p-3 rounded-xl border text-center font-bold text-base shadow-sm ${statusInfo.color}">
                        ${statusInfo.text}
                    </div>

                    <div class="bg-gray-50 p-3 rounded-xl border">
                        <p class="text-xs font-bold text-gray-500 mb-2">餐點明細：</p>
                        ${itemsHtml}
                        <div class="flex justify-between pt-2 mt-2 border-t font-bold text-gray-800">
                            <span>總計</span>
                            <span class="text-indigo-600 text-lg">NT$ ${order.total_price}</span>
                        </div>
                    </div>
                </div>
            `;
        }

        function manualSearch() {
            const val = document.getElementById('searchOrderId').value.trim();
            if (!val) {
                alert('請輸入訂單編號！');
                return;
            }
            currentOrderId = val;
            localStorage.setItem('my_last_order_id', val);
            
            const newUrl = window.location.protocol + "//" + window.location.host + window.location.pathname + '?id=' + val;
            window.history.pushState({path: newUrl}, '', newUrl);

            fetchOrderStatus();
            startPolling();
        }

        function startPolling() {
            if (pollTimer) clearInterval(pollTimer);
            pollTimer = setInterval(fetchOrderStatus, 5000);
        }

        init();
    </script>
</body>
</html>
